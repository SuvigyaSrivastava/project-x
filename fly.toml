# Deploy: fly launch --no-deploy (first time, to generate app name/region)
#         fly secrets set LINKEDIN_COOKIE='...' API_KEY='...'
#         fly deploy
#
# min_machines_running = 1 is deliberate: this service's whole speed case
# rests on a warm connection pool, warm cache, and a circuit breaker that
# remembers state across requests. Scaling to zero throws all of that away
# on the next cold start -- exactly the Lambda problem this design exists
# to avoid.

app = "linkedin-profile-api"
primary_region = "sin"  # Singapore -- adjust to whatever's closest to you

[build]

[env]
  PORT = "8000"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
